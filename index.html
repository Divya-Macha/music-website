<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="myMusic">
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <button onclick="playMusic()">Play Music</button>

    <script>
        function playMusic() {
            const audio = document.getElementById("myMusic");
            audio.play();
        }
    </script>

</body>
</html>
